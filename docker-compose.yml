services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: eventhorizon-postgres
    environment:
      POSTGRES_DB: eventhorizon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - eventhorizon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # .NET API Backend
  api:
    build:
      context: ./src/EventHorizon.Api
      dockerfile: Dockerfile
    container_name: eventhorizon-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=eventhorizon;Username=postgres;Password=postgres;Port=5432
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eventhorizon-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  eventhorizon-network:
    driver: bridge
